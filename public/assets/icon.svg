<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" color="#f2ece1">
  <!-- The tile only shows where this file is the favicon. Pages that <use>
       #mark get just the dial, drawn in currentColor, so it takes the theme. -->
  <rect width="48" height="48" rx="11" fill="#1e1a14"/>
  <g id="mark" fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- A day as a dial: the faint ring is the 24 hours, the bold arc the part
         already lived well, the hand where you are now. -->
    <circle cx="24" cy="24" r="15" stroke-width="3" opacity="0.3"/>
    <path d="M24 9 A15 15 0 0 1 36.99 31.5" stroke-width="3.6"/>
    <path d="M24 24 L31.8 28.5" stroke-width="3"/>
    <circle cx="24" cy="24" r="2.6" fill="currentColor" stroke="none"/>
  </g>
</svg>
