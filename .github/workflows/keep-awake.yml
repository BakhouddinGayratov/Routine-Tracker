# Keep the free Render service awake.
#
# Render spins a free web service down after 15 minutes without a request, and
# a sleeping server sends no reminders. This pings /api/health every 10
# minutes, which is inside that window; the reminder scheduler's own 10-minute
# grace means a reminder that came due during a nap still goes out.
#
# 24/7 uptime is ~730 instance-hours a month, inside Render's free 750.
#
# Setup: repository → Settings → Secrets and variables → Actions → Variables,
# add APP_URL (for example https://routine-tracker.onrender.com). Without it
# the job does nothing, so a fork never pings someone else's server.
name: keep-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL is not set; nothing to ping."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL/api/health" || echo 000)
          echo "$APP_URL/api/health -> $code"
          # A cold start can take up to a minute; a single bad ping is not a
          # failure worth an email, but anything other than 200 is reported.
          [ "$code" = "200" ]
